name: t1747u-fabric Ubuntu full pnpm test

# Verifies exact tip 1847d287cd806b823e2a420ca99d843204013712 (Fabric patterns)

on:
  workflow_dispatch:
  push:
    branches: [cos/t1747u-fabric-ubuntu-verify]

permissions:
  contents: read

jobs:
  full-pnpm-test:
    name: pnpm test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact t1747u fabric tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1847d287cd806b823e2a420ca99d843204013712
          persist-credentials: false

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Record environment
        run: |
          set -eux
          node -v
          pnpm -v
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "1847d287cd806b823e2a420ca99d843204013712"

      - run: pnpm install --frozen-lockfile

      - name: Full pnpm test
        run: pnpm test
